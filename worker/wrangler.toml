# One helper per website (one doctor, or several doctors on the same site). Change name, vars and the KV id for each client.
name = "dr-sample-helper"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
DOCTOR_NAME = "Dr. Sample Name"
DAILY_ROOM_URL = ""                       # e.g. https://drsample.daily.co/consult
ALLOWED_ORIGINS = "https://drmirshadck.github.io"   # the doctor's site, e.g. https://drsample.com,https://www.drsample.com
VAPID_SUBJECT = "mailto:support@arshees.com"
# Several doctors on one website: list them here (then DOCTOR_NAME / DAILY_ROOM_URL are ignored)
# DOCTORS_JSON = '''[{"id":"anish","name":"Dr. Anish Mohan","roomUrl":"https://dranish.daily.co/consult"},{"id":"second","name":"Dr. Second","roomUrl":"https://drsecond.daily.co/consult"}]'''

[[kv_namespaces]]
binding = "PUSH"
id = "a399c94d216b43aea26f0aca5db8df5a"   # sample doctor; each doctor gets their own

# Secrets (never in this file):
#   one doctor:  CAL_API_KEY, DAILY_API_KEY, PIN_HASH          -> node make-secrets.mjs <PIN>
#   several:     CAL_KEYS {"id":"key"}, DAILY_KEYS {"id":"key"}, PINS -> node make-secrets.mjs anish=<PIN> second=<PIN>
#   always:      SESSION_SECRET, CAL_WEBHOOK_SECRET, VAPID_PUBLIC_KEY, VAPID_PRIVATE_JWK
