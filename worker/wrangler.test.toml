# TEST ONLY: own calendar on the Neuron Homoeos sample (arshees.com/samples/reg-mwlf8h7qv884/).
# Deployed by Cloudflare Workers Builds from branch own-calendar with:  npx wrangler deploy -c wrangler.test.toml
name = "dotcom-by-arshees-calendar-test"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://arshees.com,https://www.arshees.com"
VAPID_SUBJECT = "mailto:support@arshees.com"
CALENDAR = "own"
TIMEZONE = "Asia/Kolkata"
RETAIN_DAYS = "365"
CHANGE_CUTOFF_HOURS = "2"
DOCTORS_JSON = '''[{"id": "nagaraja", "name": "Dr Nagaraja Rao"}, {"id": "imran", "name": "Dr Imran Khan"}]'''
# Patient emails (mail.js) via Zoho ZeptoMail, sender name = CLINIC_NAME. Off until secret ZEPTO_TOKEN is added.
EMAIL_PROVIDER = "zeptomail"
EMAIL_FROM = "yourbooking@arshees.com"
ZEPTO_HOST = "api.zeptomail.com"
CLINIC_NAME = "Neuron Homoeos"
SITE_URL = "https://arshees.com/samples/reg-mwlf8h7qv884/"
CLINIC_WHATSAPP = "971586576586"
SCHEDULE_JSON = '''{"tz":"Asia/Kolkata","week":{"1":[["08:00","12:00"],["16:00","20:00"]],"2":[["08:00","12:00"],["16:00","20:00"]],"3":[["08:00","12:00"],["16:00","20:00"]],"4":[["08:00","12:00"],["16:00","20:00"]],"5":[["08:00","12:00"],["16:00","20:00"]],"6":[["08:00","12:00"],["16:00","20:00"]],"0":[]},"gap":10,"notice":2,"ahead":30,"types":{"online-video-consultation":{"name":"Online video consultation","length":20,"confirm":true}}}'''

[[durable_objects.bindings]]
name = "CALS"
class_name = "Calendar"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Calendar"]

[[kv_namespaces]]
binding = "PUSH"
id = "821630048aaa43d2862d1064d4c1b6da"

# Secrets (Cloudflare dashboard → Settings → Variables and Secrets):
#   PINS, SESSION_SECRET, DATA_KEY, VAPID_PUBLIC_KEY, VAPID_PRIVATE_JWK
#   emails: ZEPTO_TOKEN
